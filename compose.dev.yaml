services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:5173:5173"

    develop:
      watch:
        # 일반 코드 변경: 동기화
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
            - content/
            - package.json
            - package-lock.json

        # Markdown 변경: 동기화 + 서버 재시작
        - action: sync+restart
          path: ./content
          target: /app/content

        # 의존성 변경: 이미지 재빌드
        - action: rebuild
          path: ./package.json

        - action: rebuild
          path: ./package-lock.json
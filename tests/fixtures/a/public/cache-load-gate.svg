<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1">
  <!-- 이 이미지는 앱이 hydration을 진행하는 동안 window.load를 늦추는 테스트 입력이다.
       Nginx는 이 경로의 실제 응답만 초당 256바이트로 제한한다.
       브라우저는 매번 고유 query를 사용해 이전 이미지 캐시가 지연을 없애지 못하도록 한다.
       앱의 fetch, SW 메시지, 저장된 캐시를 조작하지 않으며 최근 글 요청도 그대로 실행한다.
       본문 길이는 전송 제한 아래에서 load 지연을 만들기 위한 것으로 화면에는 표시하지 않는다.
       테스트는 새로고침 없이 첫 접속에서 최신 글이 표시될 것을 요구한다.
       이후 새로고침 성공은 진단 정보이며 최초 접속의 실패를 상쇄하지 않는다. -->
  <rect width="1" height="1" fill="transparent"/>
</svg>
